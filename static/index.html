<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cull</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Top bar: instruction box, Run, Export. -->
  <header id="topbar">
    <span class="brand">Cull</span>
    <textarea id="instruction" rows="1" placeholder="e.g. cull this shoot to about 30"></textarea>
    <button id="run-btn" type="button">Run</button>
    <button id="export-btn" type="button" disabled>Export</button>
    <span id="spinner" class="spinner" hidden></span>
    <span id="status" class="status">loading…</span>
    <label class="tile-size">Size
      <input id="tile-size" type="range" min="2" max="10" step="1" value="6" />
    </label>
  </header>

  <!-- Live status bar: picks, coverage, and whether every rule is met. -->
  <div id="statusbar" role="status" aria-live="polite">
    <span id="sb-picks"></span>
    <span id="sb-moments"></span>
    <span id="sb-reason"></span>
  </div>

  <div id="layout">
    <!-- Left panel: plan controls and rule report. -->
    <aside id="leftpanel">
      <div class="panel-section">
        <h3>View</h3>
        <div id="view-toggle" class="toggle" role="group" aria-label="Picks view">
          <button id="view-cull" type="button" class="active" aria-pressed="true">Cull</button>
          <button id="view-topn" type="button" aria-pressed="false">Top-N</button>
        </div>
      </div>
      <div class="panel-section">
        <div class="filter-head">
          <h3>Filter</h3>
          <button id="filter-clear" type="button" class="link">Clear</button>
        </div>
        <div id="filter-status" class="chips" role="group" aria-label="Status filter">
          <button type="button" class="chip on" data-status="all" aria-pressed="true">All</button>
          <button type="button" class="chip" data-status="picks" aria-pressed="false">Picks</button>
          <button type="button" class="chip" data-status="notpicked" aria-pressed="false">Not picked</button>
        </div>
        <div id="filter-issues" class="chips" role="group" aria-label="Issue filter">
          <button type="button" class="chip" data-issue="blink" aria-pressed="false">Blink <span class="chip-n" data-count="blink">0</span></button>
          <button type="button" class="chip" data-issue="blur" aria-pressed="false">Blur <span class="chip-n" data-count="blur">0</span></button>
          <button type="button" class="chip" data-issue="exposure" aria-pressed="false">Exposure <span class="chip-n" data-count="exposure">0</span></button>
        </div>
        <div id="filter-tags" class="chips" role="group" aria-label="Tag filter"></div>
        <p id="filter-count" class="filter-count"></p>
      </div>
      <div class="panel-section">
        <h3>Plan</h3>
        <label class="field">target
          <input id="plan-target" type="number" min="0" step="1" />
        </label>
        <label class="field">cap per moment
          <input id="plan-cap" type="number" min="0" step="1" />
        </label>
        <label class="field check">
          <input id="plan-allow-intentional" type="checkbox" />
          allow intentional eyes closed
        </label>
        <button id="replan-btn" type="button">Re-plan</button>
      </div>
      <div class="panel-section">
        <h3>Rule report</h3>
        <ul id="report" class="report"></ul>
        <p id="explanation" class="explanation"></p>
      </div>
      <div class="panel-section">
        <p class="keyhint">Keys: &larr;&rarr;&uarr;&darr; move &middot; P pick &middot; X reject &middot; U clear &middot; Space loupe &middot; Esc close &middot; Ctrl+Z undo</p>
      </div>
    </aside>

    <main id="grid">
      <!-- Moments render as rows here. -->
    </main>
  </div>

  <!-- Full-resolution single-frame overlay (Space to open). -->
  <div id="loupe" hidden><img id="loupe-img" alt="" /><div id="loupe-info"></div></div>

  <script src="views.js"></script>
  <script src="app.js"></script>
</body>
</html>
